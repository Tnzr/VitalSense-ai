name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight deps
        run: pip install pyyaml
      - name: Compile all Python
        run: python -m compileall -q webapp ml/cardia deploy finance billing scripts
      - name: Reproduce the finance model
        run: python finance/model.py --out /tmp/Finance.md

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            webapp/requirements.txt
            requirements-dev.txt
      - name: Install CPU torch + deps
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1 torchaudio==2.11.0 torchvision==0.29.1
          pip install -r ml/requirements.txt -r webapp/requirements.txt -r requirements-dev.txt
      - name: Fetch HLS-CMDS (Zenodo)
        run: |
          mkdir -p data/HLS-CMDS && cd data/HLS-CMDS
          for f in HS LS Mix; do
            curl -fsSL --retry 3 -o $f.zip "https://zenodo.org/api/records/15376628/files/$f.zip/content"
            curl -fsSL --retry 3 -o $f.csv "https://zenodo.org/api/records/15376628/files/$f.csv/content"
            unzip -q -o $f.zip
          done
      - name: Pytest
        run: python -m pytest -q tests

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm install
      - run: npm run build

  gateway:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: gateway } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: gateway/package-lock.json }
      - run: npm install
      - run: npm run typecheck

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [cloudflare, neon, modal, github]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt
        run: terraform fmt -check -recursive infra/terraform
      - name: validate
        working-directory: infra/terraform/${{ matrix.module }}
        run: |
          terraform init -backend=false
          terraform validate

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: OSS license inventory
        run: |
          python -m pip install --quiet pip-licenses
          pip-licenses --format=markdown --with-urls > /tmp/licenses.md || true
          head -50 /tmp/licenses.md
